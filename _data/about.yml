# ABOUT section: paragraphs and the stat counters.
# Bold text: wrap words in **double stars**.
# ─────────────────────────────────────────────────────────────

section:
  label: About Me
  label_icon: fa-solid fa-user-astronaut
  title: Platform Engineering
  title_highlight: Meets SRE          # shown in the accent colour after the title
  subtitle: Infrastructure as code. Pipelines as culture. Reliability as a standard.

# One entry per paragraph
paragraphs:
  - "I'm **Sri Harsha Kondreddy**, a DevOps and SRE professional with **8+ years of experience** building, automating, and supporting production infrastructure. My career has grown from Linux systems engineering into cloud platforms, Kubernetes, and production release engineering."
  - "I deploy and operate **Kubernetes platforms** across on-premises and cloud environments, including bare-metal servers, Azure and Oracle VMs, **AKS and EKS** — including air-gapped clusters with offline delivery. My work spans high availability, CI/CD, infrastructure automation, observability, upgrades, and incident recovery. I manage production changes from planning and validation through rollout, rollback readiness, and handoff."
  - "I've **co-led source-control and CI/CD modernization**, built operational automation and runbooks, and developed an **AI-powered log-triage proof of concept**. I use AI as an engineering tool and validate its output before relying on it."

# Animated counters. count = the number it counts up to; suffix = text after it.
# Each stat shows a small sparkline, unless you give it a "note" instead.
stats:
  - { label: Containers per Env, count: 100, suffix: "+" }
  - { label: Platform Uptime,    count: 98,  suffix: "%" }
  - { label: Years in Prod,      count: 8,   suffix: "+" }
  - { label: Team Coordinated,   count: 5,   suffix: "",  note: as acting lead }

