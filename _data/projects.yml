# ─────────────────────────────────────────────────────────────
# PROJECTS section: one card per project. Cards alternate left/right automatically.
#
# Fields:
#   name, emoji, description
#   tags   technology chips. Plain names get colours automatically in order
#          (orange, green, cyan, amber, yellow). Or use { name: X, color: g }.
#   link         optional { label, url } — shows a small link under the description
#   case_study   optional. Adds the "View case study" button with:
#                metrics (3 small value/label boxes), challenge, approach, impact
#
# To add a project: copy a block (from "- name:" down to its tags) and edit it.
# ─────────────────────────────────────────────────────────────

section:
  label: Projects
  label_icon: fa-solid fa-diagram-project
  title: Featured
  title_highlight: Projects
  subtitle: Kubernetes, release engineering, and automation work from production and customer environments.

projects:
  - name: "Air-Gapped Kubernetes on RHEL 9: Offline Delivery & 1.35 Upgrade"
    emoji: 🛰️
    description: Deployed, upgraded, and operated an air-gapped HA Kubernetes cluster on **RHEL 9.7** — 3 control planes and 5 workers behind an HAProxy API load balancer, containerd 2.2, Calico, NFS storage, and firewalld allow-lists — rolled out from a team-built offline installer, QA first and then production. Authored the **1.32 → 1.35** release patch.
    tags: [Kubernetes, RHEL, Air-Gapped, HAProxy, containerd]
    case_study:
      metrics:
        - { value: "1.32→1.35", label: "upgrade patch" }
        - { value: "3 + 5", label: "control planes + workers" }
        - { value: "~650 MB", label: "offline bundle" }
      challenge: "The customer environment had no internet access, a restricted registry, and strict firewall rules, yet the cluster had to stay current and supportable."
      approach: "Built complete offline bundles (dependency-resolved RPMs, container images, Python wheels) moved by checksummed transfer into a local RPM repository; configured containerd proxy drop-ins and pull secrets; authored the 1.32 → 1.35 patch (kubeadm v1beta3 → v1beta4, pinned containerd, etcd, CoreDNS and pause versions) and ran offline CoreDNS and Calico operator upgrades with rollback."
      impact: "A repeatable, internet-free delivery path that moves the platform from QA to production with the same artifacts and a tested rollback."

  - name: "Kubernetes Container Runtime Migration: Docker → containerd on RHEL"
    emoji: 🔄
    description: Executed the migration of the Kubernetes container runtime from Docker to **containerd on RHEL-based nodes** — a distinct and technically complex process on RHEL compared with other Linux distributions — validating workloads in each environment with a rollback runbook ready.
    tags: [Kubernetes, RHEL, containerd, Docker]
    case_study:
      metrics:
        - { value: "RHEL", label: "node OS" }
        - { value: "containerd", label: "new runtime" }
        - { value: "runbook", label: "with rollback" }
      challenge: "Kubernetes removed dockershim, so the Docker runtime on RHEL nodes had to move to containerd without breaking running workloads."
      approach: "Planned a node-by-node migration to containerd, updated node and runtime configuration, and validated workloads in every environment before promotion, with a rollback runbook at each step."
      impact: "Clusters stayed on a supported runtime and could keep taking Kubernetes upgrades, with a documented procedure the team can reuse."

  - name: "Multi-Version Kubernetes Deployments (v1.21–v1.35)"
    emoji: ⬆️
    description: Deployed Kubernetes clusters across versions **v1.21 to v1.35**, matching the version to each customer's requirements — security patches, supported features, and end-of-life timelines — including Kubespray 1.31 builds on RHEL 8.10 and 9.7.
    tags: [Kubernetes, Kubespray, kubeadm, RHEL, Helm]
    case_study:
      metrics:
        - { value: "1.21→1.35", label: "versions deployed" }
        - { value: "Kubespray", label: "build tooling" }
        - { value: "RHEL 8 / 9", label: "node OS" }
      challenge: "Each customer needed a different Kubernetes version based on their own security, support, and compatibility requirements."
      approach: "Matched the version to each customer's requirements — for example recommending 1.34 over a requested 1.32 because of its end-of-life date — and built clusters with Kubespray, using dry runs (--check --diff) and targeted reruns, with database and configuration backups taken before any rebuild."
      impact: "Customers got clusters on the Kubernetes version they needed, built and validated the same way every time."

  - name: Log4Shell (CVE-2021-44228) Emergency Patch & Cross-Environment Remediation
    emoji: 🛡️
    description: As Release Engineer, responded to the critical **Log4Shell** vulnerability by executing an emergency library patch and driving remediation delivery across all environments — development, test, preproduction, and production.
    tags: [Security, Log4j, Kubernetes, Release Engineering]
    case_study:
      metrics:
        - { value: "4", label: "environments" }
        - { value: "CVE", label: "2021-44228" }
        - { value: "emergency", label: "release" }
      challenge: "A critical zero-day exposed Java services to remote code execution and had to be patched quickly without destabilizing production."
      approach: "Coordinated the emergency library patch through development, test, preproduction, and production, owning release delivery and validation at each stage."
      impact: "Remediation delivered across all environments through the normal release path rather than ad-hoc fixes."

  - name: "From Docker to Multi-Master Kubernetes with Kubespray"
    emoji: ☸️
    description: At Intelligrated (2021–2023), moved services from standalone **Docker** hosts with no HA or DR to **Kubernetes with Helm charts** — chosen over Docker Swarm — then scaled from a single control-plane node to a **multi-master** cluster with open-source Kubespray on on-premises and VMware servers.
    tags: [Kubernetes, Kubespray, Helm, Docker, VMware]
    case_study:
      metrics:
        - { value: "1 → 5", label: "control-plane nodes" }
        - { value: "2021–2023", label: "timeline" }
        - { value: "on-prem + VMware", label: "infrastructure" }
      challenge: "Services ran on standalone Docker hosts with no high availability or disaster recovery, and a single Kubernetes master later proved to be a single point of failure: power outages or patching meant downtime."
      approach: "Chose Kubernetes with Helm charts over Docker Swarm, then moved from one control-plane node to a multi-master cluster using open-source Kubespray, customized with our own scripts for the HAProxy install, versions and install paths, NFS storage, certificates, and application-specific dependencies."
      impact: "Better high availability and disaster recovery overall: the platform keeps running through a master outage or planned patching."

  - name: "Org-Wide SCM & CI/CD Migration: Bitbucket + Bamboo → GitHub & GitHub Actions"
    emoji: 🚀
    description: Co-led an org-wide source control and CI/CD migration, moving **100–150 repositories** from Bitbucket to GitHub and reworking CI/CD pipeline configurations from Bamboo to GitHub Actions — covering planning, implementation, cutover, validation, and handover.
    tags: [GitHub Actions, CI/CD, Bitbucket, Bamboo, Migration]
    case_study:
      metrics:
        - { value: "100–150", label: "repositories" }
        - { value: "co-led", label: "migration" }
        - { value: "Bamboo → GHA", label: "pipelines rebuilt" }
      challenge: "The organization decided to move off Bitbucket and Bamboo to GitHub and GitHub Actions for security, licensing, and official tooling approval reasons — without disrupting ongoing releases."
      approach: "Co-led planning and cutover, converted pipelines to GitHub Actions, maintained self-hosted runner configuration, and rolled out static analysis across repositories."
      impact: "Teams consolidated onto the approved GitHub and GitHub Actions platform, with releases moving through reviewed pull requests."

  - name: AI-Assisted Operations with Human Validation
    emoji: 🤖
    description: Use AI in day-to-day operations to troubleshoot **VM slowness** and **cache issues** and to find the relevant entries in large logs, always validating the output against live systems before acting. Built **Ask Your Logs**, a proof-of-concept FastAPI service that reads Elasticsearch logs, redacts secrets, and asks a local or cloud LLM for a plain-English summary.
    tags: [AI, GitHub Copilot, FastAPI, Elasticsearch, Ollama]

  - name: "SpringInfo: Chrome Extension for the Eureka Service Registry"
    emoji: 🍃
    description: Built and published a Chrome extension that reads the Spring **Eureka** service registry, so the SE team can quickly validate service versions and status during releases.
    tags: [Chrome Extension, JavaScript, Spring Boot, Eureka]
    link:
      label: Chrome Web Store
      url: https://chromewebstore.google.com/detail/springinfo/iecndflkildoooajkgdllmdjplpjabdf
