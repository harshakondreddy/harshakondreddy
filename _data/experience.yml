# ─────────────────────────────────────────────────────────────
# EXPERIENCE section: one entry per job, newest first.
#
# Fields:
#   role, company, location, period   plain text
#   company_note optional small text after the company, e.g. a former name
#   emoji        fallback icon shown if there is no logo
#   logo         optional image in assets/logos/ (leave out if none)
#   highlights   optional small metric chips above the bullets: { value: "100+", label: containers }
#   bullets      one line per achievement. Bold: wrap words in **double stars**
#   tags         technology chips. Either a plain name (colour picked automatically)
#                or { name: X, color: g } where color is one of:
#                  ""  orange (default)   g  green   c  cyan   a  amber   y  yellow
#
# To add a job: copy an existing block (from "- role:" down to its tags) and edit it.
# ─────────────────────────────────────────────────────────────

section:
  label: Experience
  label_icon: fa-solid fa-briefcase
  title: Professional
  title_highlight: Journey
  subtitle: 8+ years building mission-critical infrastructure across four companies in the US and India.

# Filter buttons shown above the timeline ("All" is added automatically).
# A button only appears if at least one job has a matching tag.
filter_buttons: [Kubernetes, RHEL, Docker, Azure, EKS, Terraform, Jenkins, GitHub Actions, Helm]

