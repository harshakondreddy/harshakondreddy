# ─────────────────────────────────────────────────────────────
# SKILLS section: the scrolling logo strip and the skill groups.
# icon = a Devicon class (devicon.dev, add " colored" for brand colours)
#        or a Font Awesome class (fontawesome.com/icons)
# style = optional CSS for the icon (colour / size)
# core_percent = optional. Marks a core skill with a ★; clicking it shows this percentage.
# ─────────────────────────────────────────────────────────────

section:
  label: Skills
  label_icon: fa-solid fa-layer-group
  title: My Tech
  title_highlight: Arsenal
  subtitle: Battle-tested technologies across cloud, containers, CI/CD, monitoring, and more.

# Logos in the scrolling strip (the list is repeated automatically for the loop)
marquee_icons:
  - devicon-redhat-plain colored
  - devicon-azure-plain colored
  - devicon-kubernetes-plain colored
  - devicon-docker-plain colored
  - devicon-podman-plain colored
  - devicon-terraform-plain colored
  - devicon-ansible-plain colored
  - devicon-jenkins-plain colored
  - devicon-github-original colored
  - devicon-helm-original colored
  - devicon-grafana-original colored
  - devicon-prometheus-original colored
  - devicon-python-plain colored
  - devicon-linux-plain colored
  - devicon-postgresql-plain colored
  - devicon-apachekafka-original colored
  - devicon-nginx-original colored
  - devicon-elasticsearch-plain colored
  - devicon-rabbitmq-original colored
  - devicon-git-plain colored

groups:
  - name: Containers & Orchestration
    icon: fa-solid fa-cubes
    skills:
      - { name: Kubernetes, icon: devicon-kubernetes-plain colored, core_percent: 95 }
      - { name: Kubespray,  icon: fa-solid fa-cubes-stacked, style: "color:var(--cy);font-size:.85rem" }
      - { name: Docker,     icon: devicon-docker-plain colored, core_percent: 90 }
      - { name: containerd, icon: fa-solid fa-box, style: "color:var(--t2);font-size:.85rem" }
      - { name: Podman,     icon: devicon-podman-plain colored }
      - { name: Helm,       icon: devicon-helm-original colored }
      - { name: HAProxy,    icon: fa-solid fa-server, style: "color:var(--cy);font-size:.85rem" }

  - name: Cloud & Infrastructure
    icon: fa-solid fa-cloud
    skills:
      - { name: Azure,         icon: devicon-azure-plain colored, core_percent: 76 }
      - { name: AKS,           icon: devicon-azure-plain colored, core_percent: 76 }
      - { name: EKS,           icon: devicon-amazonwebservices-plain-wordmark colored, core_percent: 86 }
      - { name: Oracle VMs,    icon: devicon-oracle-original colored }
      - { name: RHEL,          icon: devicon-redhat-plain colored }
      - { name: Linux,         icon: devicon-linux-plain colored }
      - { name: Air-gapped ops, icon: fa-solid fa-plane-slash, style: "color:var(--gr);font-size:.85rem" }
      - { name: Nginx,         icon: devicon-nginx-original colored }

  - name: AI-Assisted Engineering
    icon: fa-solid fa-robot
    skills:
      - { name: GitHub Copilot,         icon: fa-brands fa-github, style: "color:var(--t2)" }
      - { name: Microsoft 365 Copilot,  icon: fa-solid fa-wand-magic-sparkles, style: "color:var(--cy);font-size:.85rem" }
      - { name: LLM APIs (Gemini · OpenAI · Azure OpenAI), icon: fa-solid fa-brain, style: "color:var(--p);font-size:.85rem" }
      - { name: Ollama (local LLMs),    icon: fa-solid fa-microchip, style: "color:var(--acc);font-size:.85rem" }
      - { name: FastAPI,                icon: devicon-fastapi-plain colored }
      - { name: AI output validation,   icon: fa-solid fa-shield-halved, style: "color:var(--gr);font-size:.85rem" }

  - name: CI/CD & Automation
    icon: fa-solid fa-gears
    skills:
      - { name: GitHub Actions, icon: devicon-githubactions-plain colored, core_percent: 84 }
      - { name: Jenkins,        icon: devicon-jenkins-plain colored, core_percent: 72 }
      - { name: Terraform,      icon: devicon-terraform-plain colored, core_percent: 78 }
      - { name: Ansible,        icon: devicon-ansible-plain colored }
      - { name: Git,            icon: devicon-git-plain colored }
      - { name: Bash / Shell,   icon: devicon-bash-plain, style: "color:var(--t2)" }

  - name: Monitoring & Observability
    icon: fa-solid fa-chart-line
    skills:
      - { name: Prometheus,    icon: devicon-prometheus-original colored, core_percent: 70 }
      - { name: Grafana,       icon: devicon-grafana-original, style: "color:#F46800", core_percent: 70 }
      - { name: Elasticsearch, icon: devicon-elasticsearch-plain colored }
      - { name: Kibana,        icon: devicon-kibana-original, style: "color:#F04E98" }
      - { name: AppDynamics,   icon: fa-solid fa-eye,       style: "color:var(--p);font-size:.85rem" }

  - name: Messaging & Databases
    icon: fa-solid fa-database
    skills:
      - { name: Kafka,      icon: devicon-apachekafka-original, style: "color:var(--t2)" }
      - { name: RabbitMQ,   icon: devicon-rabbitmq-original colored }
      - { name: PostgreSQL, icon: devicon-postgresql-plain colored }

  - name: Programming
    icon: fa-solid fa-code
    skills:
      - { name: Python, icon: devicon-python-plain colored }
      - { name: Java,   icon: devicon-java-plain colored }
      - { name: Groovy, icon: devicon-groovy-plain colored }
