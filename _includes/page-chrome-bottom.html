{%- comment -%}Back-to-top button, side section rail, ⌘K command palette (layout only).{%- endcomment -%}
<button id="btt" aria-label="Back to top">{% include icon.html cls="fa-solid fa-arrow-up" %}</button>

<!-- SIDE SECTION RAIL -->
<div id="srail" role="navigation" aria-label="Section navigation">
  <a href="#home" data-label="Home" aria-label="Home"></a>
  <a href="#about" data-label="About" aria-label="About"></a>
  <a href="#skills" data-label="Skills" aria-label="Skills"></a>
  <a href="#experience" data-label="Experience" aria-label="Experience"></a>
  <a href="#education" data-label="Education" aria-label="Education"></a>
  <a href="#certifications" data-label="Certifications" aria-label="Certifications"></a>
  <a href="#projects" data-label="Projects" aria-label="Projects"></a>
  <a href="#opensource" data-label="Open Source" aria-label="Open Source"></a>
</div>

<!-- COMMAND PALETTE -->
<div id="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="cmdk-box">
    <div class="cmdk-in">
      {% include icon.html cls="fa-solid fa-magnifying-glass" %}
      <input id="cmdkInput" type="text" placeholder="Jump to a section or run a command…" autocomplete="off" spellcheck="false" aria-label="Search commands">
    </div>
    <div class="cmdk-list" id="cmdkList"></div>
  </div>
</div>
