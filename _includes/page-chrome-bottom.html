{%- comment -%}Back-to-top button, side section rail, ⌘K command palette and page-transition overlay (layout only).{%- endcomment -%}
<button id="btt" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

<!-- SIDE SECTION RAIL -->
<div id="srail" role="navigation" aria-label="Section navigation">
  <a href="#home" data-label="Home"></a>
  <a href="#about" data-label="About"></a>
  <a href="#skills" data-label="Skills"></a>

<!-- COMMAND PALETTE -->
<div id="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="cmdk-box">
    <div class="cmdk-in">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="cmdkInput" type="text" placeholder="Jump to a section or run a command…" autocomplete="off" spellcheck="false" aria-label="Search commands">
    </div>
    <div class="cmdk-list" id="cmdkList"></div>
  </div>
</div>


<div id="pgwipe" aria-hidden="true"><div class="pw-fill"></div><div class="pw-grain"></div><div class="pw-label"></div></div>
