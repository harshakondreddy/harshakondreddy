{%- assign s = site.data.site -%}
<!-- FOOTER -->
<footer>
  <div class="fi">
    <div class="flogo">{{ s.name | escape }}</div>
    <p class="fsub">{{ s.name | escape }} · {{ s.job_title | escape }} · {{ s.location_short | escape }}<br><a href="mailto:{{ s.email }}">{{ s.email }}</a></p>
    <div class="fsoc">
      <a href="{{ s.github_url }}" target="_blank" rel="noopener" class="sico"><i class="fa-brands fa-github"></i></a>
      <a href="{{ s.linkedin_url }}" target="_blank" rel="noopener" class="sico"><i class="fa-brands fa-linkedin"></i></a>
      <a href="mailto:{{ s.email }}" class="sico"><i class="fa-solid fa-envelope"></i></a>
    </div>
    <div class="fbot">© {{ s.footer.copyright_year }} {{ s.name | escape }} · {{ s.footer.tagline | escape }}</div>
  </div>
</footer>
