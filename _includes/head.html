  <script>(function(){var t=localStorage.getItem('hk-theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);})()</script>
  <script>
  /* GPU acceleration detection — runs synchronously so CSS class is present before first paint */
  (function(){
    function detectSoftwareRenderer(){
      try{
        var c=document.createElement('canvas');
        var gl=c.getContext('webgl')||c.getContext('experimental-webgl');
        if(!gl)return true; /* no WebGL at all → definitely software */
        var dbg=gl.getExtension('WEBGL_debug_renderer_info');
        if(dbg){
          var r=(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)||'').toLowerCase();
          /* SwiftShader = Chrome's CPU renderer; llvmpipe = Mesa CPU renderer */
          if(/swiftshader|llvmpipe|softpipe|microsoft basic render/i.test(r))return true;
        }
        return false;
      }catch(e){return false;}
    }
    if(detectSoftwareRenderer()){
      document.documentElement.classList.add('no-gpu');
      /* expose flag for JS feature gates below */
      window.__noGPU=true;
    }
  })();
  </script>
